<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- У готических шрифтов риса нет кириллицы: русский добирается из Monomakh -->
<fontconfig>
  <alias>
    <family>Grenze Gotisch</family>
    <accept><family>Monomakh</family></accept>
  </alias>
  <alias>
    <family>UnifrakturCook</family>
    <accept><family>Monomakh</family></accept>
  </alias>
</fontconfig>
